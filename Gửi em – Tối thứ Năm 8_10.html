<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi em – Tối thứ Năm 8/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --night:#1a1530; --night2:#2b2148; --wine:#7a1f3d; --seal:#a3253f;
  --gold:#d9b46c; --paper:#fbf3ec; --ink:#3a2433; --blush:#e8a7b5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#141026; --night2:#241b3e; } }
:root[data-theme="dark"]{ --night:#141026; --night2:#241b3e; }
*,*::before,*::after{box-sizing:inherit;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100%;
  background:radial-gradient(ellipse at 50% 120%, var(--night2), var(--night) 70%);
  background-color:var(--night);
  color:var(--paper);
  font-family:"Playfair Display", Georgia, "Times New Roman", serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow-x:hidden;padding:2rem 1rem;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}

.stage{position:relative;z-index:1;width:min(360px,92vw);display:flex;flex-direction:column;align-items:center}
.hint{font-style:italic;color:var(--gold);opacity:.85;margin-bottom:1.5rem;font-size:1rem;transition:opacity .4s}

/* Envelope */
.env{position:relative;width:100%;aspect-ratio:3/2;cursor:pointer;perspective:900px;border:0;background:none;padding:0}
.env:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:6px}
.env-back{position:absolute;inset:0;background:var(--wine);border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.env-front{position:absolute;inset:0;border-radius:6px;z-index:3;
  background:
   linear-gradient(to top right, transparent 49.5%, #8c2747 50%) left/50% 100% no-repeat,
   linear-gradient(to top left, transparent 49.5%, #8c2747 50%) right/50% 100% no-repeat,
   var(--wine);
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);}
.flap{position:absolute;top:0;left:0;right:0;height:62%;z-index:4;transform-origin:top;
  background:#6a1a35;clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .7s cubic-bezier(.6,0,.3,1), z-index 0s .35s}
.seal{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);z-index:5;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #c8405a, var(--seal) 60%, #7d1a30);
  display:grid;place-items:center;color:var(--paper);font-family:"Dancing Script",cursive;font-size:1.6rem;
  box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.08);transition:opacity .3s}
.card{position:absolute;left:6%;right:6%;top:8%;bottom:6%;z-index:2;background:var(--paper);border-radius:4px;
  transition:transform .9s cubic-bezier(.3,.7,.2,1) .45s}

.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0}
.open .card{transform:translateY(-55%)}
.open + .hint{opacity:0}

/* Letter */
.letter{width:100%;background:var(--paper);color:var(--ink);border-radius:4px;padding:2.25rem 1.75rem 2rem;
  text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.5);position:relative;
  opacity:0;transform:translateY(30px);pointer-events:none;max-height:0;overflow:hidden;
  transition:opacity .8s 1.1s, transform .8s 1.1s}
.letter::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold);border-radius:2px;pointer-events:none}
.revealed .env{display:none}
.revealed .letter{opacity:1;transform:none;pointer-events:auto;max-height:none;transition:opacity .9s, transform .9s}
.to{font-family:"Dancing Script",cursive;font-size:2.6rem;color:var(--wine);line-height:1.1}
.lead{font-style:italic;margin:.9rem 0 1.6rem;line-height:1.7;font-size:1.02rem}
.when{font-size:2.9rem;font-weight:600;color:var(--wine);line-height:1}
.date{margin-top:.35rem;font-size:1.05rem;letter-spacing:.02em}
.rule{width:48px;height:1px;background:var(--gold);margin:1.4rem auto}
dl{display:grid;gap:1rem;font-size:1rem;line-height:1.5}
dt{font-size:.85rem;color:#8a6a77;font-style:italic}
dd{font-weight:600}
.sign{font-family:"Dancing Script",cursive;font-size:1.7rem;color:var(--wine);margin-top:1.6rem}
.yes{margin-top:1.4rem;font:inherit;font-size:1rem;border:1px solid var(--wine);background:var(--wine);color:var(--paper);
  padding:.7rem 1.6rem;border-radius:999px;cursor:pointer;transition:background .2s}
.yes:hover{background:#621831}
.yes:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.yes[disabled]{background:transparent;color:var(--wine);cursor:default}
.heart{position:fixed;z-index:9;pointer-events:none;font-size:1.4rem;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-60vh) scale(.6);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01s!important;animation:none!important}
}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>

<main class="stage" id="stage">
  <button class="env" id="env" aria-label="Mở thư mời">
    <span class="env-back"></span>
    <span class="card"></span>
    <span class="env-front"></span>
    <span class="flap"></span>
    <span class="seal">♥</span>
  </button>
  <p class="hint">Chạm để mở thư nhé</p>

  <article class="letter" aria-live="polite">
    <h1 class="to">Gửi em,</h1>
    <p class="lead">Anh có một buổi tối muốn dành riêng cho hai đứa mình.</p>
    <p class="when">19:00</p>
    <p class="date">Thứ Năm, ngày 8 tháng 10</p>
    <div class="rule"></div>
    <dl>
      <div><dt>Địa điểm</dt><dd>Bí mật 🤫</dd></div>
      <div><dt>Trang phục</dt><dd>Thật xinh đẹp, như em vẫn vậy</dd></div>
    </dl>
    <p class="sign">Anh đợi em ♥</p>
    <button class="yes" id="yes">Em đồng ý</button>
  </article>
</main>

<script>
(function(){
  var s=document.getElementById('stars');
  for(var i=0;i<60;i++){var e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=(Math.random()*3)+'s';s.appendChild(e);}
  var env=document.getElementById('env'), stage=document.getElementById('stage');
  env.addEventListener('click',function(){
    if(env.classList.contains('open'))return;
    env.classList.add('open');
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){stage.classList.add('revealed');}, reduce?50:1500);
  });
  var yes=document.getElementById('yes');
  yes.addEventListener('click',function(e){
    yes.textContent='Hẹn anh tối thứ Năm nhé ♥';yes.disabled=true;
    var r=yes.getBoundingClientRect();
    for(var i=0;i<14;i++){var h=document.createElement('span');h.className='heart';h.textContent='♥';
      h.style.color=['#e8a7b5','#a3253f','#d9b46c'][i%3];
      h.style.left=(r.left+r.width/2)+'px';h.style.top=r.top+'px';
      h.style.setProperty('--dx',(Math.random()*240-120)+'px');h.style.animationDelay=(i*0.05)+'s';
      document.body.appendChild(h);setTimeout(h.remove.bind(h),2000);}
  });
})();
</script>
</body>
</html>
